name: AI TEST ECR Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cicd

concurrency:
  group: ai-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Ruff lint
        continue-on-error: true
        run: ruff check . --output-format=github

      - name: Ruff format check
        continue-on-error: true
        run: ruff format --check .

      - name: Pytest
        continue-on-error: true
        run: pytest -q || echo "::warning::Tests failed or no tests found"

  build_and_push:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      id-token: write
      contents: read
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
      ecr_registry: ${{ steps.meta.outputs.ecr_registry }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          ECR_REPOSITORY="${{ vars.ECR_REPOSITORY || 'ai-test' }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE_TAG="sha-${SHORT_SHA}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          IMAGE_URI_LATEST="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          docker build -t "${IMAGE_URI}" -t "${IMAGE_URI_LATEST}" .
          docker push "${IMAGE_URI}"
          docker push "${IMAGE_URI_LATEST}"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "ecr_registry=${ECR_REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  deploy_via_ssm:
    runs-on: ubuntu-latest
    needs: build_and_push
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      - name: Deploy to AI EC2 via SSM
        id: deploy
        run: |
          set -euo pipefail
          AWS_REGION="${{ vars.AWS_REGION || 'ap-northeast-2' }}"
          CONTAINER_NAME="${{ vars.CONTAINER_NAME || 'ai-test' }}"
          PORT="${{ vars.APP_PORT || '8000' }}"
          TARGET_ROLE_TAG="${{ vars.TARGET_ROLE_TAG || 'ai' }}"
          TARGET_NAME_TAG="${{ vars.TARGET_NAME_TAG || 'doktori-ai' }}"
          TARGET_STACK_TAG="${{ vars.TARGET_STACK_TAG || 'compute' }}"
          TARGET_PROJECT_TAG="${{ vars.TARGET_PROJECT_TAG || 'doktori' }}"
          ECR_REGISTRY="${{ needs.build_and_push.outputs.ecr_registry }}"
          IMAGE_URI="${{ needs.build_and_push.outputs.image_uri }}"

          COMMANDS=$(jq -n \
            --arg region "${AWS_REGION}" \
            --arg registry "${ECR_REGISTRY}" \
            --arg image "${IMAGE_URI}" \
            --arg cname "${CONTAINER_NAME}" \
            --arg port "${PORT}" \
            '[
              "set -eu",
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
              ("docker pull " + $image),
              ("docker stop " + $cname + " || true"),
              ("docker rm " + $cname + " || true"),
              ("docker run -d --name " + $cname + " -p " + $port + ":" + $port + " --restart unless-stopped --env-file /home/ubuntu/app/ai/.env " + $image),
              "docker image prune -f"
            ]')

          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets \
              "Key=tag:Role,Values=${TARGET_ROLE_TAG}" \
              "Key=tag:Name,Values=${TARGET_NAME_TAG}" \
              "Key=tag:Stack,Values=${TARGET_STACK_TAG}" \
              "Key=tag:Project,Values=${TARGET_PROJECT_TAG}" \
            --parameters "{\"commands\": ${COMMANDS}}" \
            --timeout-seconds 300 \
            --comment "deploy test ai ${{ github.sha }}" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${CMD_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM Command: ${CMD_ID}"

      - name: Poll SSM command status
        run: |
          set -euo pipefail
          CMD_ID="${{ steps.deploy.outputs.command_id }}"

          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$CMD_ID" \
              --query "CommandInvocations[0].Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "[$i/60] $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut)
                aws ssm list-command-invocations --command-id "$CMD_ID" --details \
                  --query "CommandInvocations[0].CommandPlugins[0].Output" --output text || true
                exit 1 ;;
            esac
          done

          echo "::error::SSM command timed out"
          aws ssm list-command-invocations --command-id "$CMD_ID" --details \
            --query "CommandInvocations[0].CommandPlugins[0].Output" --output text || true
          exit 1

      - name: Notify Discord
        if: always()
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          ACTIONS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${{ job.status }}" == "success" ]; then
            COLOR=3066993; STATUS_EMOJI="✅"; STATUS_TEXT="배포 성공"
          else
            COLOR=15158528; STATUS_EMOJI="❌"; STATUS_TEXT="배포 실패"
          fi

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"content\": \"$STATUS_EMOJI **AI Server TEST 배포 알림**\",
                 \"embeds\": [{
                   \"title\": \"🧪 [TEST] $STATUS_TEXT\",
                   \"color\": $COLOR,
                   \"fields\": [
                     {\"name\": \"📦 저장소\", \"value\": \"\`${{ github.repository }}\`\", \"inline\": true},
                     {\"name\": \"🌿 브랜치\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true},
                     {\"name\": \"🔖 커밋\", \"value\": \"[\`$SHORT_SHA\`]($COMMIT_URL)\", \"inline\": true},
                     {\"name\": \"💬 커밋 메시지\", \"value\": \"$COMMIT_MSG\", \"inline\": false},
                     {\"name\": \"👤 작성자\", \"value\": \"$COMMIT_AUTHOR\", \"inline\": true},
                     {\"name\": \"📋 상세 로그\", \"value\": \"[Actions에서 확인]($ACTIONS_URL)\", \"inline\": true}
                   ],
                   \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
                 }]
               }" \
               ${{ secrets.DISCORD_WEBHOOK_URL }} || true
